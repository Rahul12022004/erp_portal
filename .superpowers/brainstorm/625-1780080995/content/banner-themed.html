<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Cookie Banner — ERP Theme</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: hsl(210,20%,98%); min-height: 100vh; display: flex; flex-direction: column; }

  /* ── ERP colour tokens ── */
  :root {
    --primary: hsl(168,80%,36%);
    --primary-dark: hsl(168,80%,28%);
    --sidebar-bg: hsl(222,47%,11%);
    --foreground: hsl(220,30%,10%);
    --muted: hsl(220,14%,92%);
    --border: hsl(220,13%,91%);
  }

  /* ── Page wrapper ── */
  .page { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 0; }

  /* ── Login card (simplified) ── */
  .login-card {
    background: white;
    border-radius: 24px;
    padding: 28px;
    width: 100%;
    max-width: 360px;
    box-shadow: 12px 12px 24px rgba(0,0,0,.12), -12px -12px 24px rgba(255,255,255,.9);
  }
  .login-card h3 { font-size: 15px; font-weight: 700; color: var(--foreground); text-align: center; margin-bottom: 4px; }
  .login-card p  { font-size: 12px; color: #94a3b8; text-align: center; margin-bottom: 20px; }
  .field { height: 36px; border-radius: 8px; border: 1px solid var(--border); width: 100%; margin-bottom: 10px; background: var(--muted); }
  .btn-signin {
    width: 100%; height: 38px; border-radius: 8px; border: none; font-size: 13px; font-weight: 600;
    background: var(--primary); color: white; cursor: pointer; transition: all .2s;
    margin-top: 6px;
  }
  .btn-signin:disabled { background: #94a3b8; cursor: not-allowed; }
  .btn-signin:not(:disabled):hover { background: var(--primary-dark); }
  .hint { font-size: 10px; color: #ef4444; text-align: center; margin-top: 6px; min-height: 14px; }

  /* ── Cookie banner ── */
  #banner {
    width: 100%;
    max-width: 360px;
    background: var(--sidebar-bg);
    border-radius: 0 0 16px 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    overflow: hidden;
  }
  #banner.hidden { display: none; }

  .banner-text { flex: 1; }
  .banner-text strong { font-size: 12px; color: white; display: block; margin-bottom: 2px; }
  .banner-text span   { font-size: 10px; color: #94a3b8; line-height: 1.4; }

  .banner-btns { display: flex; gap: 8px; flex-shrink: 0; }
  .btn-accept {
    padding: 7px 14px; border-radius: 6px; border: none; font-size: 11px; font-weight: 600;
    background: var(--primary); color: white; cursor: pointer; transition: background .15s;
  }
  .btn-accept:hover { background: var(--primary-dark); }
  .btn-decline {
    padding: 7px 14px; border-radius: 6px; border: none; font-size: 11px; font-weight: 600;
    background: hsl(222,30%,20%); color: #94a3b8; cursor: pointer; transition: background .15s;
  }
  .btn-decline:hover { background: hsl(222,30%,24%); }

  /* ── Cookie SVG wrapper ── */
  .cookie-wrap { width: 36px; height: 36px; flex-shrink: 0; position: relative; }
  .cookie-wrap svg { width: 36px; height: 36px; }

  /* Spin animation */
  @keyframes cookieSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  .c-spin { animation: cookieSpin 5s linear infinite; transform-origin: 20px 20px; }

  /* Accept: bite + shrink out */
  @keyframes bite {
    0%   { clip-path: circle(100%); }
    40%  { clip-path: ellipse(70% 100% at 70% 50%); }
    60%  { clip-path: ellipse(70% 100% at 70% 50%); opacity: 1; }
    100% { clip-path: ellipse(70% 100% at 70% 50%); opacity: 0; transform: scale(0.6) rotate(20deg); }
  }
  .c-bite { animation: bite 0.6s ease-in forwards; transform-origin: 20px 20px; }

  /* Decline: crack — top half up, bottom half down */
  #top-half, #bot-half { position: absolute; top: 0; left: 0; width: 36px; height: 36px; opacity: 0; }
  @keyframes crackTop {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-14px) rotate(-8deg); }
  }
  @keyframes crackBot {
    0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(14px) rotate(8deg); }
  }
  .do-crack-top { animation: crackTop 0.45s ease-out forwards; }
  .do-crack-bot { animation: crackBot 0.45s ease-out forwards; }

  /* Banner slide out */
  @keyframes slideOut {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(20px); }
  }
  .slide-out { animation: slideOut 0.3s ease-in forwards; }

  /* Reset note */
  .reset-note { font-size: 10px; color: #64748b; text-align: center; margin-top: 12px; }
  .reset-note a { color: var(--primary); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="page">

  <!-- Login card -->
  <div class="login-card">
    <h3>Your School</h3>
    <p>Administrator Portal</p>
    <div class="field"></div>
    <div class="field"></div>
    <button class="btn-signin" id="signin-btn" disabled>Sign In</button>
    <div class="hint" id="hint">Accept cookies to continue</div>
  </div>

  <!-- Cookie banner -->
  <div id="banner">

    <!-- Cookie icon with layers -->
    <div class="cookie-wrap">
      <!-- Full spinning cookie (shown by default) -->
      <svg id="cookie-full" viewBox="0 0 40 40">
        <g class="c-spin" id="cookie-g">
          <circle cx="20" cy="20" r="18" fill="#c8852d"/>
          <circle cx="14" cy="14" r="3.2" fill="#7c4a1a"/>
          <circle cx="27" cy="13" r="2.6" fill="#7c4a1a"/>
          <circle cx="20" cy="23" r="3.0" fill="#7c4a1a"/>
          <circle cx="12" cy="26" r="2.2" fill="#7c4a1a"/>
          <circle cx="28" cy="25" r="2.8" fill="#7c4a1a"/>
          <circle cx="22" cy="14" r="1.8" fill="#7c4a1a"/>
        </g>
      </svg>
      <!-- Top half (for crack) -->
      <svg id="top-half" viewBox="0 0 40 40">
        <defs><clipPath id="clipTop"><rect x="0" y="0" width="40" height="20"/></clipPath></defs>
        <g clip-path="url(#clipTop)">
          <circle cx="20" cy="20" r="18" fill="#c8852d"/>
          <circle cx="14" cy="14" r="3.2" fill="#7c4a1a"/>
          <circle cx="27" cy="13" r="2.6" fill="#7c4a1a"/>
          <circle cx="22" cy="14" r="1.8" fill="#7c4a1a"/>
        </g>
        <!-- crack line highlight -->
        <line x1="2" y1="20" x2="38" y2="20" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
      </svg>
      <!-- Bottom half (for crack) -->
      <svg id="bot-half" viewBox="0 0 40 40">
        <defs><clipPath id="clipBot"><rect x="0" y="20" width="40" height="20"/></clipPath></defs>
        <g clip-path="url(#clipBot)">
          <circle cx="20" cy="20" r="18" fill="#c8852d"/>
          <circle cx="20" cy="23" r="3.0" fill="#7c4a1a"/>
          <circle cx="12" cy="26" r="2.2" fill="#7c4a1a"/>
          <circle cx="28" cy="25" r="2.8" fill="#7c4a1a"/>
        </g>
      </svg>
    </div>

    <div class="banner-text">
      <strong>We use cookies</strong>
      <span>Essential cookies keep your session secure after login.</span>
    </div>

    <div class="banner-btns">
      <button class="btn-accept" onclick="doAccept()">Accept</button>
      <button class="btn-decline" onclick="doDecline()">Decline</button>
    </div>
  </div>

  <p class="reset-note">To replay: <a onclick="resetDemo()">reset demo</a></p>
</div>

<script>
function doAccept() {
  // Stop spin, play bite
  const g = document.getElementById('cookie-g');
  g.classList.remove('c-spin');

  const full = document.getElementById('cookie-full').querySelector('g');
  full.style.animation = 'none';
  // Restart with bite
  void full.offsetWidth;

  // Apply bite to the full cookie group
  const wrap = document.getElementById('cookie-full');
  wrap.style.animation = 'none';
  wrap.style.clipPath = '';

  // Animate the whole SVG with bite
  const allG = document.getElementById('cookie-g');
  allG.style.animationPlayState = 'paused';
  allG.style.animation = 'bite 0.55s ease-in forwards';
  allG.style.transformOrigin = '20px 20px';

  // Then slide banner out
  setTimeout(() => {
    const banner = document.getElementById('banner');
    banner.classList.add('slide-out');
    setTimeout(() => {
      banner.classList.add('hidden');
      document.getElementById('signin-btn').disabled = false;
      document.getElementById('hint').textContent = '';
    }, 300);
  }, 580);
}

function doDecline() {
  // Hide full cookie, show halves
  document.getElementById('cookie-full').style.opacity = '0';
  const top = document.getElementById('top-half');
  const bot = document.getElementById('bot-half');
  top.style.opacity = '1';
  bot.style.opacity = '1';
  top.classList.add('do-crack-top');
  bot.classList.add('do-crack-bot');

  // Keep banner visible, show sign-in disabled state more clearly
  setTimeout(() => {
    top.style.opacity = '0';
    bot.style.opacity = '0';
    // Reset cookie back to spinning for continued display
    document.getElementById('cookie-full').style.opacity = '1';
    top.classList.remove('do-crack-top');
    bot.classList.remove('do-crack-bot');
  }, 500);

  document.getElementById('signin-btn').disabled = true;
  document.getElementById('hint').textContent = 'Accept cookies to continue';
}

function resetDemo() {
  const banner = document.getElementById('banner');
  banner.classList.remove('hidden','slide-out');
  banner.style.animation = '';

  const allG = document.getElementById('cookie-g');
  allG.style.animation = '';
  void allG.offsetWidth;
  allG.classList.add('c-spin');

  document.getElementById('cookie-full').style.opacity = '1';
  document.getElementById('signin-btn').disabled = true;
  document.getElementById('hint').textContent = 'Accept cookies to continue';
}
</script>
</body>
</html>
