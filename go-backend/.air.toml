root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server.exe ./cmd/server"
  bin = "./tmp/server.exe"
  delay = 1000
  exclude_dir = ["tmp", "bin"]
  include_ext = ["go"]
  kill_delay = "0s"
  rerun_delay = 500

[log]
  time = false

[color]
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
